name: Practice Software Testing API Scheduled Tests

on:
  schedule:
    # Runs Monday to Friday at 10:00 PM Chicago Time (CST/CDT) is 03:00 UTC (Standard) or 02:00 UTC (Daylight Saving).
    - cron: '0 3 * * 1-5'

  # Allows manual triggering for debugging/on-demand runs
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'DIT'
        type: choice
        options:
          - DIT
          - SIT
          - UAT
          - PLT
          - PRD

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: Determine Environment based on Day of Week
        id: set-env
        run: |
          # If triggered manually, use the input. If scheduled, map day of week.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "env_name=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # Get current day of week (1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri)
            DAY_OF_WEEK=$(date +%u)
            case $DAY_OF_WEEK in
              1) echo "env_name=DIT" >> $GITHUB_OUTPUT ;;  # Monday
              2) echo "env_name=SIT" >> $GITHUB_OUTPUT ;;  # Tuesday
              3) echo "env_name=UAT" >> $GITHUB_OUTPUT ;;  # Wednesday
              4) echo "env_name=PLT" >> $GITHUB_OUTPUT ;;  # Thursday
              5) echo "env_name=PRD" >> $GITHUB_OUTPUT ;;  # Friday
              *) echo "env_name=DIT" >> $GITHUB_OUTPUT ;;
            esac
          fi

  run-tests:
    needs: determine-environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '26'
          cache: 'maven'

      - name: Run Maven Tests for practice-softwaretesting-api
        id: maven-test
        env:
          TEST_ENV: ${{ needs.determine-environment.outputs.env_name }}
        # Execute Maven command targeting specifically the practice-softwaretesting-api module
        working-directory: ./practice-softwaretesting-api
        continue-on-error: true
        run: |
          echo "=================================================="
          echo "Running practice-softwaretesting-api tests for environment: $TEST_ENV"
          echo "=================================================="
          
          mvn clean test -Denv=$TEST_ENV

      - name: Zip Test Reports (Optional Attachment)
        if: always()
        env:
          TEST_ENV: ${{ needs.determine-environment.outputs.env_name }}
        run: |
          cd practice-softwaretesting-api/target
          if [ -d "surefire-reports" ]; then
            zip -r practice-softwaretesting-api_${TEST_ENV}_surefire-reports.zip surefire-reports
          fi

      - name: Send Test Results Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME  }}
          password: ${{ secrets.SMTP_PASSWORD}}
          subject: "Test Results [Environment: ${{ needs.determine-environment.outputs.env_name }}] - Practice SoftwareTesting API"
          to: ${{ secrets.SMTP_RECEIVERS }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Hi Team,
            
            Scheduled API tests for 'practice-softwaretesting-api' have finished executing.
            
            - Environment: ${{ needs.determine-environment.outputs.env_name }}
            - Workflow Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please check the attached surefire reports for full stack traces or test outcomes.
          attachments: practice-softwaretesting-api/target/practice-softwaretesting-api_${{ needs.determine-environment.outputs.env_name }}_surefire-reports.zip
          ignore_cert: true